# CodeRabbit configuration for CMDDR.
#
# Most of this repository's diff by file count is not authored: the harvest
# fetches vatican.va index pages verbatim into tools/fixtures/, and both
# data/documents/ and registry/ are regenerated from scratch on every
# `npm run harvest && npm run render`. CI already guards them far more
# strictly than review can -- it re-runs both and fails on any drift, so a
# generated file that disagrees with the code that produced it cannot merge.
#
# Reviewing them is therefore noise, and on a harvest PR it is a lot of noise:
# a single pontificate can add thirty fetched pages. Filtering them keeps
# review on the code, the mapping tables and the tests, which is where the
# decisions actually live.

reviews:
  path_filters:
    - "!tools/fixtures/**"   # HTML fetched verbatim from vatican.va
    - "!data/documents/**"   # generated by `npm run harvest`
    - "!registry/**"         # generated by `npm run render`

  path_instructions:
    - path: "tools/src/mappings/**"
      instructions: >-
        These are hand-curated adjudication tables. The project's cardinal rule is
        evidence per entry, never inferred: every entry carries a `note` quoting text
        actually read from the source document on vatican.va. Flag any entry whose note
        is missing, empty, or asserts something the entry itself does not support. A rule
        with no evidence is deleted rather than retro-justified -- so also flag any entry
        that appears to be speculative or generalised from another entry rather than
        observed. Do not suggest broadening a pattern to cover hypothetical inputs.
    - path: "tools/src/harvest/**"
      instructions: >-
        Two properties matter more than style here. First, determinism: two consecutive
        harvest runs must be byte-identical, so flag any locale-sensitive comparison,
        clock read, or iteration whose order is not pinned -- these feed document
        identifiers. Second, silent loss: an item that is dropped or merged away without
        a warning is the worst failure mode in this pipeline, worse than a wrong value,
        because nothing surfaces it. Flag any early return or overwrite on a collision
        that produces no warning.
